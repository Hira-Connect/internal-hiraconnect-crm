# Supabase CLI config for HIRA Connect CRM (hira-connect-portal)
# Remote project ref: tcojgrxtpldiieytvthl  (org: akqbnjemvmmgfwyxgzwo)
# Link with:  supabase link --project-ref tcojgrxtpldiieytvthl
project_id = "internal-hiraconnect-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the remote Postgres major version (project runs PG 17)
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local email testing inbox
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "https://internal-hiraconnect-crm.vercel.app"
additional_redirect_urls = [
  "https://internal-hiraconnect-crm.vercel.app",
  "http://localhost:3000",
]
jwt_expiry = 3600
enable_signup = false          # admin-invite only; no public self-signup to the CRM

[auth.email]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true

[functions]
# Per-function overrides go here, e.g.:
# [functions.lead-score]
# verify_jwt = true
